name: Build LineageOS 17.1 GSI

# Builds a LineageOS 17.1 (Android 10) Treble GSI using
# https://github.com/AndyCGYan/lineage_build_unified (branch lineage-17.1).
#
# Save as: .github/workflows/build-lineage-17.1-gsi.yml
#
# NOTE: AOSP builds are huge. A free GitHub-hosted runner (4 vCPU / 16 GB RAM,
# 6 h job limit) may NOT finish a cold build in time. This workflow saves a
# ccache on every run (even a timed-out one), so re-running it makes progress.
# For reliable builds, set the repo variable RUNNER_LABEL to a larger or
# self-hosted runner (Settings -> Secrets and variables -> Actions -> Variables).

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'GSI variant to build (a/b = A-only / A-B, v = vanilla, N = no su, S = with PHH su)'
        required: true
        default: 'treble_arm64_bvN'
        type: choice
        options:
          - treble_arm64_bvN   # ARM64, A/B, vanilla
          - treble_arm64_bvS   # ARM64, A/B, vanilla + su
          - treble_arm64_avN   # ARM64, A-only, vanilla
          - treble_arm64_avS
          - treble_a64_bvN     # ARM32 userspace + 64-bit binder, A/B
          - treble_a64_bvS
          - treble_a64_avN
          - treble_a64_avS
          - treble_arm_bvN     # ARM32, A/B
          - treble_arm_bvS
          - treble_arm_avN     # ARM32, A-only
          - treble_arm_avS
          - all                # The script's own list: all six archs, S variants (needs a very large runner)
      partial_clone:
        description: 'Use a git partial clone for repo sync (saves disk; turn off if the sync fails)'
        required: false
        default: true
        type: boolean
      free_repo_dir:
        description: 'Delete .repo after patching, before compiling (frees ~20-35 GB; the compile does not need it)'
        required: false
        default: true
        type: boolean
      create_release:
        description: 'Publish the result as a GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-22.04' }}
    timeout-minutes: 360 # maximum for GitHub-hosted runners
    permissions:
      contents: write # only used by the release step

    env:
      USE_CCACHE: '1'
      # ccache lives on the big build volume, NOT on the small root disk
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: '1'
      LC_ALL: C
      GOGC: '50' # more frequent Go GC: lowers soong_build peak memory (costs a little CPU)

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          # Root keeps the OS, apt packages and the temp dir where actions/cache writes
          # its archive before upload, so it needs more than a few GB of headroom.
          root-reserve-mb: 10240
          temp-reserve-mb: 512
          swap-size-mb: 1
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout this repo (for ci-patches/)
        uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: ci-patches

      - name: Install build dependencies and repo
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python2 xz-utils

          # Android 10 expects `python` to be Python 2 (do NOT use python-is-python3)
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version

          # `repo init --git-lfs` (below) needs git-lfs plus its filter in the global git config.
          # LineageOS 17.1 now stores the WebView prebuilts in Git LFS; without this you get
          # 133-byte text pointers instead of the real .apk files.
          git lfs install --skip-repo
          git lfs version
          sudo apt-get clean

          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false
          git config --global core.compression 0

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-lineage17-${{ inputs.variant }}-${{ github.run_id }}
          restore-keys: |
            ccache-lineage17-${{ inputs.variant }}-
            ccache-lineage17-

      - name: Fetch treble_experimentations
        run: |
          # buildbot_treble.sh calls ~/treble_experimentations/apply-patches.sh
          git clone --depth=1 https://github.com/AndyCGYan/treble_experimentations "$HOME/treble_experimentations"

      - name: Initialize workspace
        run: |
          # Large volume created by maximize-build-space
          mkdir -p "$GITHUB_WORKSPACE/lineage" "$GITHUB_WORKSPACE/build-output"
          # The script writes images to ~/build-output
          ln -sfn "$GITHUB_WORKSPACE/build-output" "$HOME/build-output"

          cd "$GITHUB_WORKSPACE/lineage"

          # NOTE: no `--depth=1` on purpose. The script runs `git revert <sha>`
          # on several projects, and those commits do not exist in a shallow clone.
          # A partial clone keeps full history but defers file contents.
          EXTRA=""
          if [ "${{ inputs.partial_clone }}" = "true" ]; then
            EXTRA="--partial-clone"
          fi
          # --git-lfs is required: without it `repo` deliberately configures git to SKIP LFS
          # downloads, so external/chromium-webview/prebuilt/*/webview.apk stays a text pointer.
          repo init -u https://github.com/LineageOS/android.git -b lineage-17.1 --git-lfs $EXTRA < /dev/null

          # Directory names are what buildbot_treble.sh expects
          git clone https://github.com/AndyCGYan/treble_patches -b lineage-17.1 treble_patches
          git clone https://github.com/AndyCGYan/lineage_build_unified -b lineage-17.1 treble_build_los

      - name: Fix patches that drifted from current LineageOS 17.1
        run: |
          cd "$GITHUB_WORKSPACE/lineage"

          # 1) system/bt: LineageOS later added an LE branch inside the #if block that
          #    phh's "Make BTM_BYPASS_EXTRA_ACL_SETUP dynamic" patch rewrites, so the
          #    original no longer applies. Use the rebased copy from ci-patches/.
          #    (Do NOT just delete it: device/phh/treble defines the macro as a function
          #    call, which cannot be used in a preprocessor #if.)
          NAME="0001-Make-BTM_BYPASS_EXTRA_ACL_SETUP-dynamic.patch"
          SRC="$GITHUB_WORKSPACE/ci/ci-patches/platform_system_bt/$NAME"
          DST="treble_patches/patches/platform_system_bt/$NAME"
          test -f "$SRC" || { echo "::error::Missing ci-patches/platform_system_bt/$NAME in your repo"; exit 1; }
          test -f "$DST" || { echo "::error::Upstream no longer has $DST - re-check the patch set"; exit 1; }
          cp "$SRC" "$DST"

          # 2) microG: upstream LineageOS 17.1 now ships its own signature spoofing for
          #    microG, so Andy's older patch conflicts with it (and would define
          #    MICROG_FAKE_SIGNATURE twice). Skip it.
          SCRIPT=treble_build_los/buildbot_treble.sh
          grep -q 'Allow-selective-signature-spoofing-for-microG' "$SCRIPT" \
            || echo "::warning::microG patch line not found in $SCRIPT (already removed upstream?)"
          sed -i '/Allow-selective-signature-spoofing-for-microG/d' "$SCRIPT"
          bash -n "$SCRIPT"

      - name: Select target variant
        run: |
          cd "$GITHUB_WORKSPACE/lineage/treble_build_los"
          TARGET="${{ inputs.variant }}"

          if [ "$TARGET" != "all" ]; then
            # Drop the six hard-coded `buildVariant treble_*` calls (not the
            # `buildVariant() {` function definition) and build only the chosen one.
            sed -i '/^buildVariant treble_/d' buildbot_treble.sh
            sed -i "/^ls ~\/build-output/i buildVariant $TARGET" buildbot_treble.sh
          fi

          bash -n buildbot_treble.sh
          echo "Variant calls in the script:"
          grep -n '^buildVariant' buildbot_treble.sh

      - name: Add pre-build checks (and optional .repo removal) to the build script
        run: |
          cd "$GITHUB_WORKSPACE/lineage/treble_build_los"

          # This runs inside buildbot_treble.sh after sync + patching and right before
          # compiling, so a problem shows up ~30 minutes in instead of after ~5 hours.
          cat > ci_precheck.sh <<'EOF'
          #!/bin/bash
          set -e
          shopt -s nullglob
          files=(external/chromium-webview/prebuilt/*/webview.apk)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: no external/chromium-webview/prebuilt/*/webview.apk found - did repo sync fail?"
            exit 1
          fi
          bad=0
          for f in "${files[@]}"; do
            size=$(stat -c %s "$f")
            echo "webview check: $f = $size bytes"
            if [ "$size" -lt 10000000 ]; then
              echo "ERROR: $f is a Git LFS pointer, not the real APK:"
              head -c 200 "$f"; echo
              bad=1
            fi
          done
          [ "$bad" = 0 ] || { echo "Git LFS files were not downloaded during repo sync."; exit 1; }
          EOF

          if [ "${{ inputs.free_repo_dir }}" = "true" ]; then
            # The compile never reads .repo (checked against lineage-17.1 build/soong/make).
            # The real WebView files are already in the work tree at this point.
            {
              echo 'echo "Freeing .repo:"; du -sh .repo || true'
              echo 'rm -rf .repo'
              echo 'df -h . | cat'
            } >> ci_precheck.sh
          fi
          bash -n ci_precheck.sh

          # buildbot_treble.sh patches inline (there is no applyPatches function); the patching
          # ends right before this line. $BL is defined at the top of that script.
          grep -q '^export WITHOUT_CHECK_API=true' buildbot_treble.sh \
            || { echo "::error::anchor line not found in buildbot_treble.sh"; exit 1; }
          sed -i '/^export WITHOUT_CHECK_API=true/i bash "$BL/ci_precheck.sh"' buildbot_treble.sh
          bash -n buildbot_treble.sh
          grep -n 'ci_precheck' buildbot_treble.sh

      - name: Sync, patch and build
        timeout-minutes: 330 # leave time for the cache save below if this is cut off
        run: |
          cd "$GITHUB_WORKSPACE/lineage"

          # Keep the runner agent from being OOM-killed (otherwise the job just "loses
          # communication"); the build gets killed instead and you get a real error.
          for pid in $(pgrep -f 'bin/Runner\.(Listener|Worker)' || true); do
            sudo sh -c "echo -1000 > /proc/$pid/oom_score_adj" 2>/dev/null || true
          done
          sudo sysctl -w vm.swappiness=10 || true

          # Disk and memory every 10 minutes, so a future failure shows what ran out
          ( while true; do
              sleep 600
              echo "[monitor $(date +%H:%M)]"; df -h / "$GITHUB_WORKSPACE" | cat; free -h | sed -n 1,3p
            done ) &
          MONITOR=$!
          trap 'kill $MONITOR 2>/dev/null || true; echo "[ccache stats]"; ccache -s | cat || true' EXIT

          export CCACHE_EXEC="$(command -v ccache)"
          ccache -M 4G
          bash treble_build_los/buildbot_treble.sh

      - name: Free out/ before packaging
        if: ${{ success() }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # buildbot_treble.sh already moved the finished image(s) into build-output/
          ls build-output/lineage-*.img >/dev/null 2>&1 \
            || { echo "::error::No lineage-*.img in build-output/ - the build produced no image"; exit 1; }
          df -h . | cat
          rm -rf lineage/out
          df -h . | cat

      - name: Compress images and write checksums
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "$GITHUB_WORKSPACE/build-output"
          ls -lh
          for img in lineage-*.img; do
            echo "Compressing $img"
            xz -6 -T0 -v -c "$img" > "$GITHUB_WORKSPACE/dist/$img.xz"
            rm -f "$img"
          done
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum *.img.xz | tee SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lineage-17.1-GSI-${{ inputs.variant }}
          path: |
            dist/*.img.xz
            dist/SHA256SUMS.txt
          compression-level: 0 # already xz-compressed
          retention-days: 7

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lineage-17.1-${{ inputs.variant }}-${{ github.run_id }}
          name: LineageOS 17.1 GSI (${{ inputs.variant }})
          files: |
            dist/*.img.xz
            dist/SHA256SUMS.txt

      # The cache is saved LAST on purpose: it needs a multi-GB archive on the small root disk,
      # and a full disk there must never be able to cost you the finished image above.
      - name: Trim ccache so its archive fits on the root disk
        id: ccache
        if: ${{ always() }}
        run: |
          # Each path below writes `save` exactly once; if this step fails midway the output
          # stays unset, which the Save step treats as "do not save".
          command -v ccache >/dev/null && [ -d "$CCACHE_DIR" ] \
            || { echo "No ccache to save"; echo "save=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # actions/cache writes its archive into RUNNER_TEMP, which lives on the root disk
          FREE_MB=$(df -BM --output=avail "$RUNNER_TEMP" | tail -1 | tr -dc '0-9')
          LIMIT_MB=$(( FREE_MB - 2048 ))
          [ "$LIMIT_MB" -gt 4096 ] && LIMIT_MB=4096
          echo "Root disk free: ${FREE_MB} MB -> ccache limit: ${LIMIT_MB} MB"
          df -h / "$RUNNER_TEMP" "$GITHUB_WORKSPACE" | cat

          if [ "$LIMIT_MB" -lt 512 ]; then
            echo "::warning::Not enough free space on the root disk for a useful ccache archive; skipping the cache save"
            echo "save=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ccache -M "${LIMIT_MB}M"
          ccache -c
          ccache -s | cat
          du -sh "$CCACHE_DIR"
          echo "save=true" >> "$GITHUB_OUTPUT"

      - name: Save ccache
        if: ${{ always() && steps.ccache.outputs.save == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-lineage17-${{ inputs.variant }}-${{ github.run_id }}
